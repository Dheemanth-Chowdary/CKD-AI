name: Verify CKD risk-level demo profiles

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "artifacts/ckd_model.joblib"
      - "artifacts/metadata.json"
      - "ckd_dataset.csv"
      - "tests/test_demo_profiles.py"
      - ".github/workflows/verify-risk-levels.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-risk-levels:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install model test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2.0,<3" "pandas>=2.2,<3" "scikit-learn>=1.7,<2" "xgboost>=3.0,<4" "joblib>=1.4,<2"

      - name: Verify High, Moderate and Low model outputs
        run: python tests/test_demo_profiles.py
